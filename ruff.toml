[lint]
# B008: FastAPI's Depends() in function defaults is the standard pattern.
# BLE001: Broad exception catches are acceptable in webhook/boundary handlers.
ignore = ["B008", "BLE001"]

[lint.per-file-ignores]
# SQLAlchemy ORM models use string-based forward references in relationship()
# declarations (e.g. Mapped["Session"]) that are resolved at runtime by
# SQLAlchemy's mapper registry — not resolvable by ruff's static analysis.
"backend/db/models/*.py" = ["F821"]
# Tests use assert patterns and dict() calls that are fine in test context.
"backend/tests/*.py" = ["B017", "C408", "RUF012", "B023", "SIM117"]
