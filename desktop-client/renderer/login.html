<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Platform — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f111a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .card {
      width: 360px;
      background: #1a1d2e;
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #7c6ff7;
      letter-spacing: -0.3px;
    }
    .logo p {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f111a;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #7c6ff7; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #7c6ff7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #6b5ee6; }
    button[type="submit"]:disabled { background: #3d3b6b; cursor: not-allowed; }
    .error {
      color: #f87171;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 12px;
      display: none;
    }
    .footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
    .footer-link a {
      color: #7c6ff7;
      text-decoration: none;
      cursor: pointer;
    }
    #spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Interview Platform</h1>
      <p>AI-powered interview assistance</p>
    </div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />

      <p class="error" id="errorMsg"></p>

      <button type="submit" id="submitBtn">
        <span id="btnLabel">Sign In</span>
        <div id="spinner"></div>
      </button>
    </form>

    <div class="footer-link">
      <a id="dashboardLink">Open web dashboard</a> · <a id="forgotLink">Forgot password?</a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
