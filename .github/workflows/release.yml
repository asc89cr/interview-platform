name: Release Desktop Client

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & package (Windows)
        run: npm run build && npx electron-builder --win --publish never
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CSC_LINK: ${{ secrets.WINDOWS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-client/dist/*.exe

  build-mac:
    name: Build Mac Installer
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & package (Mac)
        run: npm run build && npx electron-builder --mac --publish never
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CSC_LINK: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: desktop-client/dist/*.dmg

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
