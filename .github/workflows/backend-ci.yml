name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "alembic.ini"
      - "docker-compose.yml"
      - "backend/Dockerfile"

jobs:
  ci:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interview -d interview_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://interview:interview@localhost:5432/interview_platform_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Type-check (mypy)
        run: mypy backend/ --ignore-missing-imports

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests (pytest)
        run: pytest backend/tests/ -v

      - name: Build Docker image
        run: docker build --target production -f backend/Dockerfile -t interview-backend:ci .
